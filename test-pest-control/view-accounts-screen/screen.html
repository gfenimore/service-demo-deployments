<!-- SCREEN (screen-filters-list-001): a screen with regions -- the shells' mount_points applied one level down (SJ s56 Q9). -->
<!-- Each region is a pattern-mount the shell fills with the components whose rows name THIS screen as parent and the region as zone. -->
<div id="account-screen" class="screen screen--stacked" data-screen="a0004000-0000-0000-0000-000000000015" data-pattern="screen-filters-list-001">
    <div class="screen__regions screen__regions--stacked">
        <div class="pattern-mount screen__region screen__region--filters" data-zone="filters" data-parent="a0004000-0000-0000-0000-000000000015" data-region-of="account-screen">
            <!-- the parts placed in region "filters" mount here -->
        </div>
        <div class="pattern-mount screen__region screen__region--list" data-zone="list" data-parent="a0004000-0000-0000-0000-000000000015" data-region-of="account-screen">
            <!-- the parts placed in region "list" mount here -->
        </div>
    </div>
</div>

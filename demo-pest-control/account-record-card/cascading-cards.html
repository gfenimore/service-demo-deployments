<div class="record-card" data-blueprint-id="c3000000-0000-0000-0000-000000000001" data-root="account">
  <header class="record-card__head">
    <div class="record-card__title" data-role="title">
      <h2 class="record-card__name" data-role="name"></h2>
      <span class="record-card__tags" data-role="tags"></span>
    </div>
    <div class="record-card__actions" data-role="actions" aria-label="Actions"></div>
  </header>

  <div class="record-card__tiles" data-role="tiles"></div>

  <div class="record-card__columns">
    <section class="record-card__l1" data-role="l1" aria-labelledby="record-card-l1">
      <h3 class="record-card__cardtitle" id="record-card-l1">Account details</h3>
      <dl class="record-card__kv" data-role="projection"></dl>
      <div data-role="facts"></div>
      <ul class="record-card__drills" data-role="drills"></ul>
    </section>

    <section class="record-card__cascade" data-role="cascade" data-cascade="0" data-entity="service_target" aria-labelledby="record-card-c0">
      <h3 class="record-card__cardtitle" id="record-card-c0">Service targets <span class="record-card__count" data-role="count"></span></h3>
      <ul class="record-card__list" data-role="list" role="listbox" aria-label="Service targets"></ul>
      <div class="record-card__selected" data-role="selected"></div>
      <div class="record-card__child" data-role="child"></div>
    </section>
    <section class="record-card__cascade" data-role="cascade" data-cascade="1" data-entity="service_location" aria-labelledby="record-card-c1">
      <h3 class="record-card__cardtitle" id="record-card-c1">Work by location <span class="record-card__count" data-role="count"></span></h3>
      <ul class="record-card__list" data-role="list" role="listbox" aria-label="Work by location"></ul>
      <div class="record-card__selected" data-role="selected"></div>
      <div class="record-card__child" data-role="child"></div>
    </section>
  </div>

  <p class="record-card__waiting" data-role="waiting">Choose a Account from the list.</p>
  <p class="record-card__empty" data-role="empty" hidden>No rows for this account yet.</p>
  <p class="record-card__closed" data-role="closed" hidden></p>
  <p class="record-card__error" data-role="error" role="alert" hidden></p>
</div>

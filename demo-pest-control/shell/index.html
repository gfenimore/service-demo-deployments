<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="shell-type" content="carbon-hybrid">
    <title>Demo Pest Control</title>

    <!--
      IBM CARBON UI SHELL -- header across the top, side-nav down the left.
      Generated by CarbonShellGenerator for app a0004000-0000-0000-0000-000000000001.

      NO BUNDLER. Carbon arrives as ESM from a CDN and everything else keeps plain script tags.
      Proven 2026-08-08 before a line of this generator was written: the spike imported
      @carbon/web-components this way, mounted a real generated component beside it, and needed no
      npm install, no build step and no change to the static deploy.

      The factory's own themes/tokens-base.css is deliberately NOT linked. It is the hand-rolled
      25-token ancestor of what Carbon supplies; shipping both would put two token layers on one
      page, each claiming to own colour and spacing.
    -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@carbon/styles@1/css/styles.min.css">
    <link rel="stylesheet" href="./css/shell-layout.css">

    <!-- COMPONENT CSS -- ported from the sidebar shell (s31, 2026-08-19). The carbon port
         dropped the whole GATE 6 apparatus: emitted components were never linked, loaded or
         mounted, and the first Demo Pest Control render was an empty frame with a working nav.
         Shell CSS loads first so a component can override it. -->
    <link rel="stylesheet" href="../account-list-view/list-view.css">
    <link rel="stylesheet" href="../create-account-form/form-crud.css">
    <link rel="stylesheet" href="../account-detail-view/detail-panel.css">
    <link rel="stylesheet" href="../deactivate-account-gate/guarded-gate.css">
</head>
<body data-app-id="a0004000-0000-0000-0000-000000000001" data-shell-type="carbon-hybrid">

    <!-- ═══ HEADER ═══════════════════════════════════════════════════════════════════════════ -->
    <cds-header aria-label="Demo Pest Control">
        <cds-header-menu-button button-label-active="Close menu" button-label-inactive="Open menu"></cds-header-menu-button>
        <cds-header-name href="#" prefix="">Demo Pest Control</cds-header-name>

        <cds-header-nav menu-bar-label="Demo Pest Control">
            <cds-header-nav-item href="#" data-module-id="a0004000-0000-0000-0000-000000000002">Accounts</cds-header-nav-item>
        </cds-header-nav>

        <!--
          PERSONA SWITCHER. Hidden until app-init finds a mounted component carrying a persona
          gate -- a switcher over nothing is furniture that lies.

          !! IT MUST NOT SHIP TO PRODUCTION. In a real deployment the persona comes from whoever
          signed in, and a control that lets a user change it is a security hole wearing a
          dropdown. It is emitted here because no app yet has sign-in; the app definition should
          govern it the moment one does.
        -->
        <div class="shell-persona" id="persona-switcher" hidden>
            <label for="persona-select" class="shell-persona__label">Viewing as</label>
            <select id="persona-select" class="shell-persona__select" aria-label="Switch persona"></select>
        </div>
    </cds-header>

    <!-- ═══ SIDE NAV ═════════════════════════════════════════════════════════════════════════
      Three levels, exactly as the resolver builds them: module -> submodule -> feature. A module
      with children becomes a cds-side-nav-menu; one without becomes a plain link, because an
      expandable menu that opens onto nothing is worse than no affordance at all.
    -->
    <cds-side-nav is-not-child-of-header aria-label="Side navigation" collapse-mode="responsive">
        <cds-side-nav-items>
            <cds-side-nav-menu title="Accounts" data-module-id="a0004000-0000-0000-0000-000000000002">
                <cds-side-nav-menu-item href="#/accounts" data-feature-id="a0004000-0000-0000-0000-000000000004">View Accounts</cds-side-nav-menu-item>
                <cds-side-nav-menu-item href="#/accounts/new" data-feature-id="b7c5b459-bb73-4d88-9d46-9e0f0a732d01">New Account</cds-side-nav-menu-item>
            </cds-side-nav-menu>
        </cds-side-nav-items>
    </cds-side-nav>

    <!-- ═══ CONTENT ══════════════════════════════════════════════════════════════════════════
      #app-content is the zone shell-core mounts into, under the same id the sidebar shell uses.
      That is why shell-core.js is shared verbatim rather than forked: the contract between a shell
      and the code that mounts into it is a set of element ids, and Carbon changes the chrome
      around them, not the contract.

      The theme class goes HERE rather than on <body> on purpose. Carbon themes are CSS custom
      properties scoped by a class on any container, and they NEST -- measured 2026-08-08, a
      cds--white region inside a cds--g100 one resolves to #fff. So a dark shell with a light
      working area is a class on this element, and a per-module theme is this class changing on
      navigation. Neither needs a rebuild.
    -->
    <main id="app-content" class="app-content cds--white" role="main">
        <!-- data-zone says "main" because that is the zone vocabulary app_components rows
             actually declare (root, main, sidebar, header, footer, modal -- the shell
             mount-point ruling). "content" was a carbon-port drift no row ever named, so
             every mount failed zone lookup (s31, 2026-08-19). The id stays content-mount:
             shell-core's id fallback and existing references keep working. -->
        <div id="content-mount" class="pattern-mount" data-zone="main">
            <!-- Components mount here -->
        </div>
    </main>

    <!-- ═══ SCRIPTS ══════════════════════════════════════════════════════════════════════════ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="./js/app-config.js"></script>
    <script src="./js/shell-state.js"></script>
    <script src="./js/shell-events.js"></script>
    <script src="./js/shell-navigation.js"></script>
    <script src="./js/shell-core.js"></script>

    <!-- ===================================================================
         GATE 6 -- the components this shell mounts. Ported VERBATIM in intent from the
         sidebar shell (s31, 2026-08-19): the carbon port had mount points and nothing to
         put in them. One mounting system owns the page (C5, 2026-08-14) -- this IS that
         system; the wiring generator's files stay reference-only beside it.
         ================================================================== -->
    <script src="../account-list-view/list-view.js"></script>
    <script src="../create-account-form/form-crud.js"></script>
    <script src="../account-detail-view/detail-panel.js"></script>
    <script src="../deactivate-account-gate/guarded-gate.js"></script>

    <script>
        // GATE 6 -- what mounts where, projected from app_components.
        window.ShellMounts = [
  {
    "slug": "account-list-view",
    "name": "Account List View",
    "zone": "main",
    "order": 1,
    "blueprintId": "c1000000-0000-0000-0000-000000000001",
    "patternId": "list-view-simple-001",
    "script": "../account-list-view/list-view.js",
    "css": "../account-list-view/list-view.css",
    "route": "/accounts"
  },
  {
    "slug": "create-account-form",
    "name": "Create Account Form",
    "zone": "main",
    "order": 1,
    "blueprintId": "d0000001-0001-0001-0002-000000000001",
    "patternId": "form-crud-simple-001",
    "script": "../create-account-form/form-crud.js",
    "css": "../create-account-form/form-crud.css",
    "route": "/accounts/new"
  },
  {
    "slug": "account-detail-view",
    "name": "Account Detail View",
    "zone": "main",
    "order": 2,
    "blueprintId": "c2000000-0000-0000-0000-000000000001",
    "patternId": "detail-panel-simple-001",
    "script": "../account-detail-view/detail-panel.js",
    "css": "../account-detail-view/detail-panel.css",
    "route": "/accounts"
  },
  {
    "slug": "deactivate-account-gate",
    "name": "Deactivate Account Gate",
    "zone": "main",
    "order": 3,
    "blueprintId": "c0000001-0001-0001-0005-000000000001",
    "patternId": "guarded-gate-001",
    "script": "../deactivate-account-gate/guarded-gate.js",
    "css": "../deactivate-account-gate/guarded-gate.css",
    "route": "/accounts"
  }
];

        function preflightDataAccess() {
            var faults = [];
            var placeholder = /^__[A-Z_]+__$/;

            if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                faults.push('the Supabase client library did not load. Every component calls ' +
                            'window.supabase.createClient(); with it absent each one returns ' +
                            'early from initSupabase() and NONE of them can fetch.');
            }

            if (!window.AppContext) {
                faults.push('window.AppContext is not set -- js/app-config.js did not load. ' +
                            'Components will mount and then sit waiting for context forever.');
            } else {
                var sb = window.AppContext.supabase || {};
                if (!sb.url || !sb.anonKey) {
                    faults.push('window.AppContext.supabase is missing url or anonKey -- ' +
                                'there is no engine to talk to.');
                } else if (placeholder.test(sb.url) || placeholder.test(sb.anonKey)) {
                    faults.push('js/app-config.js still carries its generated placeholders. ' +
                                'Substitute __SUPABASE_URL__ and __SUPABASE_ANON_KEY__ for the ' +
                                'engine this deployment points at.');
                }
                if (placeholder.test(sb.schema || '')) {
                    faults.push('this app declares no domain_schema, so there is no schema to ' +
                                'query. Set app_definitions.domain_schema and regenerate.');
                }
                // The tenant is a seam member too (s31): an unsubstituted __TENANT_ID__ reaches
                // Postgres as a literal and a uuid column refuses it as a 400 on every fetch.
                if (placeholder.test(window.AppContext.tenant_id || '')) {
                    faults.push('js/app-config.js still carries __TENANT_ID__. Substitute the ' +
                                'tenant this deployment serves (Local dogfood apps: default).');
                }
            }

            faults.forEach(function (f) { console.error('[AppShell] CANNOT FETCH -- ' + f); });
            return faults.length === 0;
        }

        function mountDeclaredComponents() {
            var mounted = 0, failed = 0, fed = 0;
            window.ShellMounted = [];
            var canFetch = preflightDataAccess();
            (window.ShellMounts || []).forEach(function (m) {
                var zoneEl = document.querySelector('[data-zone="' + m.zone + '"]');
                if (!zoneEl) {
                    console.error('[AppShell] no mount point for zone "' + m.zone + '" (' + m.slug + ')');
                    failed++;
                    return;
                }
                var Cls = (window.PatternRegistry || {})[m.blueprintId];
                if (!Cls) {
                    console.error('[AppShell] component "' + m.slug + '" did not register itself ' +
                                  '(blueprint ' + m.blueprintId + ') -- was its script emitted?');
                    failed++;
                    return;
                }
                try {
                    var host = document.createElement('div');
                    host.className = 'mounted-component';
                    host.setAttribute('data-component', m.slug);
                    zoneEl.appendChild(host);

                    var instance = new Cls();
                    instance.mount(host);
                    // Instances stay reachable: the blueprint:navigate bridge below hands
                    // record ids to whichever mounted component can take one.
                    (window.ShellComponents = window.ShellComponents || {})[m.slug] = instance;
                    if (typeof instance.onContext === 'function' && window.AppContext) {
                        instance.onContext(window.AppContext);
                        fed++;
                    }
                    mounted++;
                    window.ShellMounted.push(m.slug);
                } catch (err) {
                    console.error('[AppShell] mounting "' + m.slug + '" failed:', err);
                    failed++;
                }
            });
            console.log('[AppShell] mounted ' + mounted + ' of ' +
                        (window.ShellMounts || []).length + ' declared component(s)' +
                        (failed ? ', ' + failed + ' failed' : '') +
                        '; context supplied to ' + fed);
            if (!mounted) console.warn('[AppShell] NOTHING MOUNTED -- this shell is an empty frame.');
            else if (!canFetch) {
                console.warn('[AppShell] ' + mounted + ' component(s) MOUNTED BUT CANNOT REACH ' +
                             'DATA -- see the CANNOT FETCH errors above. Anything they render is ' +
                             'a placeholder, not a row.');
            }
        }

        function wireRoutes() {
            var live = window.ShellMounted || [];
            var mounts = (window.ShellMounts || []).filter(function (m) {
                return live.indexOf(m.slug) !== -1;
            });
            var routed = {};
            var pinned = [];

            mounts.forEach(function (m) {
                if (m.route) { (routed[m.route] = routed[m.route] || []).push(m.slug); }
                else { pinned.push(m.slug); }
            });

            var dead = (window.ShellMounts || []).length - mounts.length;
            if (dead) {
                console.warn('[AppShell] ' + dead + ' declared component(s) did not mount, so ' +
                             'their screens are not routable -- those nav links will do nothing.');
            }

            var routes = Object.keys(routed);
            if (!routes.length) {
                console.warn('[AppShell] no mounted component declares a route -- every component ' +
                             'stays visible and the nav cannot switch panels. Set app_features.route.');
                return;
            }

            function show(route) {
                var wanted = routed[route] || [];
                var shown = [];
                document.querySelectorAll('.mounted-component').forEach(function (el) {
                    var slug = el.getAttribute('data-component');
                    var visible = wanted.indexOf(slug) !== -1 || pinned.indexOf(slug) !== -1;
                    el.style.display = visible ? '' : 'none';
                    if (visible) shown.push(slug);
                });
                // CURRENT LOCATION -- carbon side-nav items carry href="#<route>"; aria-current
                // carries the fact to anyone not looking at the colour.
                document.querySelectorAll('cds-side-nav-menu-item, cds-side-nav-link, [data-route]').forEach(function (a) {
                    var r = a.getAttribute('data-route') || (a.getAttribute('href') || '').replace(/^#/, '');
                    var isHere = r === route;
                    if (isHere) { a.setAttribute('aria-current', 'page'); a.setAttribute('active', ''); }
                    else { a.removeAttribute('aria-current'); a.removeAttribute('active'); }
                });
                console.log('[AppShell] route ' + route + ' -> showing ' +
                            (shown.length ? shown.join(', ') : '(nothing mounted at this route)'));
            }

            routes.forEach(function (r) {
                window.ShellNavigation.registerRoute(r, function () { show(r); });
            });

            // Carbon renders nav links with href="#/route"; intercept them into the router.
            document.addEventListener('click', function (e) {
                var path = e.composedPath ? e.composedPath() : [e.target];
                for (var i = 0; i < path.length; i++) {
                    var el = path[i];
                    if (!el.getAttribute) continue;
                    var href = el.getAttribute('data-route') || el.getAttribute('href');
                    if (href && href.charAt(0) === '#' && href.length > 1) {
                        e.preventDefault();
                        window.ShellNavigation.navigate(href.slice(1));
                        return;
                    }
                }
            });

            var navOrder = [].slice.call(document.querySelectorAll('cds-side-nav-menu-item, cds-side-nav-link'))
                             .map(function (a) { return (a.getAttribute('href') || '').replace(/^#/, ''); })
                             .filter(function (r) { return routes.indexOf(r) !== -1; });

            var declared = '/accounts';
            var start = (declared && routes.indexOf(declared) !== -1) ? declared : navOrder[0];
            if (!start) { start = routes[0]; }
            if (declared && start !== declared) {
                console.warn('[AppShell] declared default route "' + declared + '" has no mounted ' +
                             'component -- opening at "' + start + '" instead.');
            }
            window.ShellNavigation.navigate(start, false);

            console.log('[AppShell] ' + routes.length + ' route(s) registered, ' +
                        pinned.length + ' component(s) pinned; opening at ' + start);
        }

        // THE RECORD BRIDGE (s31, 2026-08-19) -- the orphaned half of C5. Components emit
        // blueprint:navigate with a per-record route no feature ever registers; the retired
        // app-init.js forwarded the route and dropped the record. Detail panels have carried a
        // public setRecordId() with no caller since they were generated. The shell owns the
        // page, so the shell owns the handoff: take the id from the event, hand it to every
        // mounted component that can receive one; fall back to plain route navigation only
        // when no component takes the record.
        document.addEventListener('blueprint:navigate', function (e) {
            var d = e.detail || {};
            var id = d.id;
            if (!id && d.route) {
                var m = /^\/[^/]+\/(.+)$/.exec(d.route);
                if (m) { id = m[1]; }
            }
            if (id) {
                var handed = 0;
                Object.keys(window.ShellComponents || {}).forEach(function (slug) {
                    var c = window.ShellComponents[slug];
                    if (c && typeof c.setRecordId === 'function') {
                        c.setRecordId(id);
                        handed++;
                    }
                });
                if (handed) {
                    console.log('[AppShell] blueprint:navigate -> record ' + id +
                                ' handed to ' + handed + ' component(s)');
                    return;
                }
            }
            if (d.route) { window.ShellNavigation.navigate(d.route); }
        });

        function bootGateSix() {
            if (window.AppShell && typeof window.AppShell.init === 'function') { window.AppShell.init(); }
            mountDeclaredComponents();
            wireRoutes();
        }

        // THE SIGN-IN GATE (s31, 2026-08-19; ruling Q2 option A). Emitted only when the app
        // declares requires_auth. The gate guards the PAGE; the GRANTS guard the data --
        // this exists so the two agree about who may be here. Users are created by the
        // operator in the Supabase dashboard; there is no signup, by ruling.
        //
        // KNOWN LIMIT, recorded: components attach the session token as a static header at
        // mount time, so a session outliving its JWT (~1h) fetches as anon until reload.
        // Acceptable for the MSP's entry sessions; revisit with the security pile.
        var REQUIRES_AUTH = true;

        function bootWhenAuthorized() {
            if (!REQUIRES_AUTH) { bootGateSix(); return; }
            var sb = (window.AppContext || {}).supabase || {};
            if (!window.supabase || !window.supabase.createClient || !sb.url || !sb.anonKey) {
                console.error('[AppShell] requires_auth is declared but the Supabase client or ' +
                              'config is missing -- refusing to mount anything.');
                return;
            }
            var auth = window.supabase.createClient(sb.url, sb.anonKey);
            window.ShellAuth = auth;

            function enter(session) {
                window.AppContext.authHeaders = { Authorization: 'Bearer ' + session.access_token };
                if (session.user && session.user.email) { window.AppContext.user_id = session.user.email; }
                var gate = document.getElementById('shell-signin-gate');
                if (gate) { gate.remove(); }
                console.log('[AppShell] signed in as ' + (window.AppContext.user_id || '(user)') + ' -- mounting.');
                bootGateSix();
            }

            function showGate() {
                var gate = document.createElement('div');
                gate.id = 'shell-signin-gate';
                gate.setAttribute('style',
                    'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;' +
                    'justify-content:center;background:var(--cds-background,#161616);');
                gate.innerHTML =
                    '<form id="shell-signin-form" style="width:20rem;padding:2rem;' +
                    'background:var(--cds-layer-01,#262626);color:var(--cds-text-primary,#f4f4f4);">' +
                    '<h1 style="font-size:1.25rem;margin:0 0 0.25rem 0;">Demo Pest Control</h1>' +
                    '<p style="font-size:0.875rem;margin:0 0 1.5rem 0;color:var(--cds-text-secondary,#c6c6c6);">Sign in to continue</p>' +
                    '<label style="display:block;font-size:0.75rem;margin-bottom:0.25rem;">Email</label>' +
                    '<input id="shell-signin-email" type="email" autocomplete="username" required ' +
                    'style="width:100%;margin-bottom:1rem;padding:0.5rem;border:0;border-bottom:1px solid #8d8d8d;background:var(--cds-field-01,#393939);color:inherit;">' +
                    '<label style="display:block;font-size:0.75rem;margin-bottom:0.25rem;">Password</label>' +
                    '<input id="shell-signin-password" type="password" autocomplete="current-password" required ' +
                    'style="width:100%;margin-bottom:1.5rem;padding:0.5rem;border:0;border-bottom:1px solid #8d8d8d;background:var(--cds-field-01,#393939);color:inherit;">' +
                    '<button type="submit" style="width:100%;padding:0.75rem;border:0;cursor:pointer;' +
                    'background:var(--cds-button-primary,#0f62fe);color:#fff;">Sign in</button>' +
                    '<p id="shell-signin-error" role="alert" style="min-height:1.25rem;font-size:0.75rem;color:#ff8389;margin:0.75rem 0 0 0;"></p>' +
                    '</form>';
                document.body.appendChild(gate);
                document.getElementById('shell-signin-form').addEventListener('submit', function (e) {
                    e.preventDefault();
                    var err = document.getElementById('shell-signin-error');
                    err.textContent = '';
                    auth.auth.signInWithPassword({
                        email: document.getElementById('shell-signin-email').value,
                        password: document.getElementById('shell-signin-password').value
                    }).then(function (r) {
                        if (r.error || !r.data || !r.data.session) {
                            err.textContent = (r.error && r.error.message) || 'Sign-in failed';
                            return;
                        }
                        enter(r.data.session);
                    });
                });
            }

            auth.auth.getSession().then(function (r) {
                var session = r.data && r.data.session;
                if (session) { enter(session); } else { showGate(); }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootWhenAuthorized);
        } else {
            bootWhenAuthorized();
        }
    </script>

    <!--
      Carbon last, and as a module. It defines custom elements; the markup above is inert until it
      resolves and then upgrades in place. Nothing else waits on it, which is why a slow CDN
      degrades to an unstyled but working page rather than a blank one.
    -->
    <script type="module">
      import 'https://esm.sh/@carbon/web-components@2.56.0/es/components/ui-shell/index.js';
      customElements.whenDefined('cds-header').then(() => {
        document.body.setAttribute('data-carbon-ready', 'true');
        console.log('[CarbonShell] Carbon UI Shell upgraded');
      }).catch(err => {
        // Named rather than swallowed: an un-upgraded shell still renders and still fetches, and
        // whoever is looking at a plain page deserves to know why.
        console.error('[CarbonShell] Carbon failed to load -- the shell will render unstyled:', err);
      });
    </script>
</body>
</html>

        function preflightDataAccess() {
            var faults = [];
            var placeholder = /^__[A-Z_]+__$/;

            if (typeof window.supabase === 'undefined' || !window.supabase.createClient) {
                faults.push('the Supabase client library did not load. Every component calls ' +
                            'window.supabase.createClient(); with it absent each one returns ' +
                            'early from initSupabase() and NONE of them can fetch.');
            }

            if (!window.AppContext) {
                faults.push('window.AppContext is not set -- js/app-config.js did not load. ' +
                            'Components will mount and then sit waiting for context forever.');
            } else {
                var sb = window.AppContext.supabase || {};
                if (!sb.url || !sb.anonKey) {
                    faults.push('window.AppContext.supabase is missing url or anonKey -- ' +
                                'there is no engine to talk to.');
                } else if (placeholder.test(sb.url) || placeholder.test(sb.anonKey)) {
                    faults.push('js/app-config.js still carries its generated placeholders. ' +
                                'Substitute __SUPABASE_URL__ and __SUPABASE_ANON_KEY__ for the ' +
                                'engine this deployment points at.');
                }
                if (placeholder.test(sb.schema || '')) {
                    faults.push('this app declares no domain_schema, so there is no schema to ' +
                                'query. Set app_definitions.domain_schema and regenerate.');
                }
                // The tenant is a seam member too (s31): an unsubstituted __TENANT_ID__ reaches
                // Postgres as a literal and a uuid column refuses it as a 400 on every fetch.
                if (placeholder.test(window.AppContext.tenant_id || '')) {
                    faults.push('js/app-config.js still carries __TENANT_ID__. Substitute the ' +
                                'tenant this deployment serves (Local dogfood apps: default).');
                }
            }

            faults.forEach(function (f) { console.error('[AppShell] CANNOT FETCH -- ' + f); });
            return faults.length === 0;
        }

        function mountDeclaredComponents() {
            var mounted = 0, failed = 0, fed = 0;
            window.ShellMounted = [];
            var canFetch = preflightDataAccess();
            (window.ShellMounts || []).forEach(function (m) {
                var zoneEl = document.querySelector('[data-zone="' + m.zone + '"]');
                if (!zoneEl) {
                    console.error('[AppShell] no mount point for zone "' + m.zone + '" (' + m.slug + ')');
                    failed++;
                    return;
                }
                var Cls = (window.PatternRegistry || {})[m.blueprintId];
                if (!Cls) {
                    console.error('[AppShell] component "' + m.slug + '" did not register itself ' +
                                  '(blueprint ' + m.blueprintId + ') -- was its script emitted?');
                    failed++;
                    return;
                }
                try {
                    var host = document.createElement('div');
                    host.className = 'mounted-component';
                    host.setAttribute('data-component', m.slug);
                    zoneEl.appendChild(host);

                    var instance = new Cls();
                    var mounting = instance.mount(host);
                    // An async mount() that rejects AFTER its first await never reaches the catch
                    // below -- the shell counted it as mounted and showed an empty zone (s38, the
                    // mount-contract gate's second self-test). The rejection is caught here, said
                    // out loud, and the slug is withdrawn from ShellMounted.
                    if (mounting && typeof mounting.then === 'function') {
                        mounting.then(null, function (err) {
                            console.error('[AppShell] mounting "' + m.slug + '" failed after its first await:', err);
                            host.setAttribute('data-mount-failed', 'true');
                            window.ShellMounted = (window.ShellMounted || []).filter(function (s) { return s !== m.slug; });
                        });
                    }
                    // Instances stay reachable: the blueprint:navigate bridge below hands
                    // record ids to whichever mounted component can take one.
                    (window.ShellComponents = window.ShellComponents || {})[m.slug] = instance;
                    if (typeof instance.onContext === 'function' && window.AppContext) {
                        instance.onContext(window.AppContext);
                        fed++;
                    }
                    mounted++;
                    window.ShellMounted.push(m.slug);
                } catch (err) {
                    console.error('[AppShell] mounting "' + m.slug + '" failed:', err);
                    failed++;
                }
            });
            console.log('[AppShell] mounted ' + mounted + ' of ' +
                        (window.ShellMounts || []).length + ' declared component(s)' +
                        (failed ? ', ' + failed + ' failed' : '') +
                        '; context supplied to ' + fed);
            if (!mounted) console.warn('[AppShell] NOTHING MOUNTED -- this shell is an empty frame.');
            else if (!canFetch) {
                console.warn('[AppShell] ' + mounted + ' component(s) MOUNTED BUT CANNOT REACH ' +
                             'DATA -- see the CANNOT FETCH errors above. Anything they render is ' +
                             'a placeholder, not a row.');
            }
        }

        // THE HEADER DRIVES THE LEFT NAV (s39 Q8). The hash is the single source of truth: boot,
        // a header click, a row click and a bookmarked URL all pass through here. The module that
        // owns the current route (longest matching feature route wins) has its side-nav group
        // shown and its header item marked current; every other group is hidden.
        function syncModuleNav() {
            var hash = (window.location.hash || '#').slice(1) || '/';
            var groups = document.querySelectorAll('cds-side-nav-items[data-for-module]');
            var best = null, bestLen = -1;
            groups.forEach(function (g) {
                g.querySelectorAll('cds-side-nav-link[href]').forEach(function (a) {
                    var r = (a.getAttribute('href') || '').slice(1);
                    if (r && hash.indexOf(r) === 0 && r.length > bestLen) {
                        best = g.getAttribute('data-for-module'); bestLen = r.length;
                    }
                });
            });
            if (!best && groups.length) best = groups[0].getAttribute('data-for-module');
            groups.forEach(function (g) { g.hidden = g.getAttribute('data-for-module') !== best; });
            // THE MODULE HOLDS ITS MARK until another module is chosen (his chair, SJ s51 2026-09-07).
            // Carbon 2.x (header-nav-item) paints the line from `is-active` AND ONLY when the host carries
            // no aria-current="page" (`--current: isActive && ariaCurrent !== "page"`); the old `active` +
            // `aria-current` pair painted nothing. Carbon writes aria-current on its own anchor.
            document.querySelectorAll('cds-header-nav-item[data-module-id]').forEach(function (it) {
                var on = it.getAttribute('data-module-id') === best;
                it.removeAttribute('aria-current'); it.removeAttribute('active');
                if (on) { it.setAttribute('is-active', ''); } else { it.removeAttribute('is-active'); }
            });
            // THE FUNCTION HOLDS ITS MARK while the focus shows its screens -- the record and its acts
            // included (his chair, SJ s51 2026-09-07): the link whose route is the LONGEST PREFIX of the
            // hash is current, not only an exact match. /operations/pending/<id>/cancel keeps
            // "Pending Work Orders" lit.
            var bestLink = null, bestLinkLen = -1;
            document.querySelectorAll('cds-side-nav-link[href]').forEach(function (a) {
                var r = (a.getAttribute('href') || '').slice(1);
                if (r && (hash === r || hash.indexOf(r + '/') === 0) && r.length > bestLinkLen) { bestLink = a; bestLinkLen = r.length; }
            });
            document.querySelectorAll('cds-side-nav-link[href]').forEach(function (a) {
                if (a === bestLink) { a.setAttribute('active', ''); a.setAttribute('aria-current', 'page'); }
                else { a.removeAttribute('active'); a.removeAttribute('aria-current'); }
            });
            // The lit function IS the way back (his chair, 2026-09-07): its link returns to the list as it
            // stands -- mounted, its filters kept -- so a record needs no breadcrumb. Nothing more here.
        }
        window.addEventListener('hashchange', syncModuleNav);
        // ShellNavigation.navigate() writes the hash with pushState, which never fires hashchange -- so an
        // in-app move (a row click, a seat, a crumb) never re-synced the marks; only boot and back/forward
        // did (SJ s51 leg 3b, 2026-09-07). Every navigate now ends in a sync, with the hash already written.
        function hookNavigate() {
            var nav = window.ShellNavigation;
            if (!nav || nav._syncHooked || typeof nav.navigate !== 'function') return;
            var original = nav.navigate;
            nav.navigate = function () {
                var result = original.apply(this, arguments);
                try { syncModuleNav(); } catch (ignored) { /* the marks are cosmetic; the route already moved */ }
                return result;
            };
            nav._syncHooked = true;
        }

        function wireRoutes() {
            hookNavigate();   // ShellNavigation stands by now (app-init ran); every navigate ends in a sync
            var live = window.ShellMounted || [];
            var mounts = (window.ShellMounts || []).filter(function (m) {
                return live.indexOf(m.slug) !== -1;
            });
            var routed = {};
            var pinned = [];
            // THE STAND-DOWN RULE (SJ s40, his red pen 2026-08-24). A component the manifest marks
            // verbCalled belongs to its verb's scenario, not to the route: the record route shows
            // the card ALONE, and the gate and the form appear only when the bar's verb summons
            // them (record-card _act un-hides the host) -- then stand down again at the next
            // route showing. Ends the s37 always-visible behavior at his words. The host is still
            // MOUNTED and furnished (the mount-contract gate stays green); display is the shell's.
            var verbCalled = {};

            mounts.forEach(function (m) {
                if (m.verbCalled) { verbCalled[m.slug] = true; }
                if (m.route) { (routed[m.route] = routed[m.route] || []).push(m.slug); }
                else { pinned.push(m.slug); }
            });

            var dead = (window.ShellMounts || []).length - mounts.length;
            if (dead) {
                console.warn('[AppShell] ' + dead + ' declared component(s) did not mount, so ' +
                             'their screens are not routable -- those nav links will do nothing.');
            }

            var routes = Object.keys(routed);
            if (!routes.length) {
                console.warn('[AppShell] no mounted component declares a route -- every component ' +
                             'stays visible and the nav cannot switch panels. Set app_features.route.');
                return;
            }

            function show(route) {
                var wanted = routed[route] || [];
                var shown = [];
                var standing = [];
                document.querySelectorAll('.mounted-component').forEach(function (el) {
                    var slug = el.getAttribute('data-component');
                    var visible = wanted.indexOf(slug) !== -1 || pinned.indexOf(slug) !== -1;
                    // Verb-called: on its route but standing down until the bar summons it.
                    if (visible && verbCalled[slug]) { visible = false; standing.push(slug); }
                    el.style.display = visible ? '' : 'none';
                    if (visible) shown.push(slug);
                });
                // CURRENT LOCATION -- carbon side-nav items carry href="#<route>"; aria-current
                // carries the fact to anyone not looking at the colour.
                // The side-nav LINKS are syncModuleNav's (the longest-prefix rule, his chair 2026-09-07);
                // an exact match here would un-light "Pending Work Orders" the moment a record opened.
                document.querySelectorAll('cds-side-nav-menu-item, [data-route]').forEach(function (a) {
                    var r = a.getAttribute('data-route') || (a.getAttribute('href') || '').replace(/^#/, '');
                    var isHere = r === route;
                    if (isHere) { a.setAttribute('aria-current', 'page'); a.setAttribute('active', ''); }
                    else { a.removeAttribute('aria-current'); a.removeAttribute('active'); }
                });
                console.log('[AppShell] route ' + route + ' -> showing ' +
                            (shown.length ? shown.join(', ') : '(nothing mounted at this route)') +
                            (standing.length ? '; standing down until summoned: ' + standing.join(', ') : ''));
            }

            // THE ROUTE'S PARAMETER IS A RECORD (s37, 2026-08-22). ShellNavigation matched `:id` and
            // this handler threw it away, so a typed or bookmarked /accounts/<id> showed the panels
            // with no record -- the next-morning re-entry opened empty. Now the matched parameter is
            // handed to every component the route shows that can take a record.
            routes.forEach(function (r) {
                window.ShellNavigation.registerRoute(r, function (params) {
                    show(r);
                    var keys = Object.keys(params || {});
                    var id = keys.length ? params[keys[0]] : null;
                    if (!id) return;
                    var handed = 0;
                    (routed[r] || []).forEach(function (slug) {
                        var c = (window.ShellComponents || {})[slug];
                        if (c && typeof c.setRecordId === 'function') { c.setRecordId(decodeURIComponent(id)); handed++; }
                    });
                    console.log('[AppShell] route ' + r + ' carries ' + keys[0] + '=' + id + ' -> handed to ' + handed + ' component(s)');
                });
            });

            // THE RECORD ROUTE under a route: /accounts -> /accounts/:id. The bridge below uses it to
            // move from a list to the record's own screen without either component knowing the other.
            function recordRouteUnder(route) {
                var under = routes.filter(function (r) {
                    return r.indexOf('/:') !== -1 && r.slice(0, r.indexOf('/:')) === route;
                });
                // SJ s51 rung 5a, sitting 2 (2026-09-09): a function's DEFAULT screen sits at its root
                // (/operations/scheduling is THE BOARD) and a list beneath it (/operations/scheduling/days)
                // hands its record to the FUNCTION'S record route (/operations/scheduling/:id) -- the
                // record's own screen belongs to the function, not to the list that found it.
                if (!under.length && route.split('/').length > 3) {
                    var parent = route.slice(0, route.lastIndexOf('/'));
                    under = routes.filter(function (r) {
                        return r.indexOf('/:') !== -1 && r.slice(0, r.indexOf('/:')) === parent;
                    });
                }
                // s44 (his chair's find): a VERB route (/accounts/:id/edit) may stand
                // beside the record route (/accounts/:id). The record's own screen is
                // the one whose parameter is TERMINAL -- a verb route is entered only
                // by its own control (the face's seat), never by a list row.
                var terminal = under.filter(function (r) {
                    return r.indexOf('/', r.indexOf('/:') + 2) === -1;
                });
                return terminal[0] || under[0] || null;
            }
            window.ShellRecordRouteUnder = recordRouteUnder;

            // Carbon renders nav links with href="#/route"; intercept them into the router.
            document.addEventListener('click', function (e) {
                var path = e.composedPath ? e.composedPath() : [e.target];
                for (var i = 0; i < path.length; i++) {
                    var el = path[i];
                    if (!el.getAttribute) continue;
                    var href = el.getAttribute('data-route') || el.getAttribute('href');
                    if (href && href.charAt(0) === '#' && href.length > 1) {
                        e.preventDefault();
                        window.ShellNavigation.navigate(href.slice(1));
                        return;
                    }
                }
            });

            var navOrder = [].slice.call(document.querySelectorAll('cds-side-nav-menu-item, cds-side-nav-link'))
                             .map(function (a) { return (a.getAttribute('href') || '').replace(/^#/, ''); })
                             .filter(function (r) { return routes.indexOf(r) !== -1; });

            var declared = '/accounts';
            var start = (declared && routes.indexOf(declared) !== -1) ? declared : navOrder[0];
            if (!start) { start = routes[0]; }
            if (declared && start !== declared) {
                console.warn('[AppShell] declared default route "' + declared + '" has no mounted ' +
                             'component -- opening at "' + start + '" instead.');
            }
            // A BOOKMARKED URL WINS (s37): the page opened at #/accounts/<id> goes there, not to the
            // default. The hash is matched against the registered patterns before it is trusted.
            var hash = (window.location.hash || '').slice(1);
            if (hash && window.ShellNavigation._matchRoute(hash)) { start = hash; }
            window.ShellNavigation.navigate(start, false);
            // The hash is the single source of truth: at boot with no hash the opening route is written
            // into it (a bookmark then carries where the app opened, and the nav marks read it).
            if (!window.location.hash || window.location.hash === '#') {
                try { history.replaceState(null, '', '#' + start); } catch (ignored) { /* file: origins */ }
            }
            syncModuleNav();

            console.log('[AppShell] ' + routes.length + ' route(s) registered, ' +
                        pinned.length + ' component(s) pinned; opening at ' + start);
        }

        // THE RECORD BRIDGE (s31, 2026-08-19) -- the orphaned half of C5. Components emit
        // blueprint:navigate with a per-record route no feature ever registers; the retired
        // app-init.js forwarded the route and dropped the record. Detail panels have carried a
        // public setRecordId() with no caller since they were generated. The shell owns the
        // page, so the shell owns the handoff: take the id from the event, hand it to every
        // mounted component that can receive one; fall back to plain route navigation only
        // when no component takes the record.
        document.addEventListener('blueprint:navigate', function (e) {
            var d = e.detail || {};
            var id = d.id;
            if (!id && d.route) {
                var m = /^\/[^/]+\/(.+)$/.exec(d.route);
                if (m) { id = m[1]; }
            }
            if (id) {
                var handed = 0;
                Object.keys(window.ShellComponents || {}).forEach(function (slug) {
                    var c = window.ShellComponents[slug];
                    if (c && typeof c.setRecordId === 'function') {
                        c.setRecordId(id);
                        handed++;
                    }
                });
                if (handed) {
                    console.log('[AppShell] blueprint:navigate -> record ' + id +
                                ' handed to ' + handed + ' component(s)');
                    // THE RECORD'S OWN SCREEN (s37): when the feature under the current route has a
                    // record route (/accounts -> /accounts/:id), go there -- the list stays a list and
                    // the card is where the picture puts it. Without one, the handoff is the whole act
                    // (the s31 list-beside-detail shape).
                    var here = window.ShellNavigation.getCurrentRoute();
                    var rec = window.ShellRecordRouteUnder ? window.ShellRecordRouteUnder(here) : null;
                    if (rec) { window.ShellNavigation.navigate(rec.replace(/:[^/]+/, encodeURIComponent(id))); }
                    // Already ON the record's page (the parented form's post-save/cancel emit lands
                    // here): re-run the current route's showing so verb-called components STAND
                    // DOWN again (s40) -- their work is done until the bar's next summons.
                    else { window.ShellNavigation.navigate(here, false); }
                    return;
                }
            }
            if (d.route) { window.ShellNavigation.navigate(d.route); }
        });

        function bootGateSix() {
            if (window.AppShell && typeof window.AppShell.init === 'function') { window.AppShell.init(); }
            mountDeclaredComponents();
            wireRoutes();
        }

        // THE SIGN-IN GATE (s31, 2026-08-19; ruling Q2 option A). Emitted only when the app
        // declares requires_auth. The gate guards the PAGE; the GRANTS guard the data --
        // this exists so the two agree about who may be here. Users are created by the
        // operator in the Supabase dashboard; there is no signup, by ruling.
        //
        // THE SHELL OWNS ONE DATA CLIENT (s31 resume, 2026-08-20). Components used to
        // build their own clients with the session JWT frozen in as a static header at
        // mount -- a session outliving its JWT then fetched as anon until reload,
        // silently (the recorded "known limit", promoted to a fixed defect the morning
        // it blanked the deployed app for a returning user). window.ShellData is the one
        // client every component shares: on a gated app its accessToken callback reads
        // the CURRENT session from ShellAuth per request, so a refreshed session is
        // simply used; on an open app it is a plain anon client.
        var REQUIRES_AUTH = true;

        function makeShellData(sb, tokenFn) {
            var opts = { db: { schema: sb.schema || 'public' } };
            if (tokenFn) { opts.accessToken = tokenFn; }
            window.ShellData = window.supabase.createClient(sb.url, sb.anonKey, opts);
        }

        function bootWhenAuthorized() {
            var sb = (window.AppContext || {}).supabase || {};
            var placeholder = /^__[A-Z_]+__$/;
            var configSane = window.supabase && window.supabase.createClient && sb.url &&
                sb.anonKey && !placeholder.test(sb.url) && !placeholder.test(sb.anonKey);

            if (!REQUIRES_AUTH) {
                if (configSane) { makeShellData(sb, null); }
                bootGateSix();
                return;
            }
            if (!configSane) {
                console.error('[AppShell] requires_auth is declared but the Supabase client or ' +
                              'config is missing -- refusing to mount anything.');
                return;
            }
            var auth = window.supabase.createClient(sb.url, sb.anonKey);
            window.ShellAuth = auth;

            function enter(session) {
                // Kept for components on shells without ShellData; here ShellData is the live path.
                window.AppContext.authHeaders = { Authorization: 'Bearer ' + session.access_token };
                if (session.user && session.user.email) { window.AppContext.user_id = session.user.email; }
                var gate = document.getElementById('shell-signin-gate');
                if (gate) { gate.remove(); }
                // Re-entry after a mid-session sign-in (the gate re-shown on session death):
                // components are already mounted, so a clean reload beats a double mount.
                if (window.__shellBooted) { window.location.reload(); return; }
                window.__shellBooted = true;
                makeShellData(sb, function () {
                    return auth.auth.getSession().then(function (r) {
                        return (r.data && r.data.session && r.data.session.access_token) || null;
                    });
                });
                console.log('[AppShell] signed in as ' + (window.AppContext.user_id || '(user)') + ' -- mounting.');
                bootGateSix();
            }

            function showGate() {
                var gate = document.createElement('div');
                gate.id = 'shell-signin-gate';
                gate.setAttribute('style',
                    'position:fixed;inset:0;z-index:10000;display:flex;align-items:center;' +
                    'justify-content:center;background:var(--cds-background,#161616);');
                gate.innerHTML =
                    '<form id="shell-signin-form" style="width:20rem;padding:2rem;' +
                    'background:var(--cds-layer-01,#262626);color:var(--cds-text-primary,#f4f4f4);">' +
                    '<h1 style="font-size:1.25rem;margin:0 0 0.25rem 0;">Demo Pest Control</h1>' +
                    '<p style="font-size:0.875rem;margin:0 0 1.5rem 0;color:var(--cds-text-secondary,#c6c6c6);">Sign in to continue</p>' +
                    '<label style="display:block;font-size:0.75rem;margin-bottom:0.25rem;">Email</label>' +
                    '<input id="shell-signin-email" type="email" autocomplete="username" required ' +
                    'style="width:100%;margin-bottom:1rem;padding:0.5rem;border:0;border-bottom:1px solid #8d8d8d;background:var(--cds-field-01,#393939);color:inherit;">' +
                    '<label style="display:block;font-size:0.75rem;margin-bottom:0.25rem;">Password</label>' +
                    '<input id="shell-signin-password" type="password" autocomplete="current-password" required ' +
                    'style="width:100%;margin-bottom:1.5rem;padding:0.5rem;border:0;border-bottom:1px solid #8d8d8d;background:var(--cds-field-01,#393939);color:inherit;">' +
                    '<button type="submit" style="width:100%;padding:0.75rem;border:0;cursor:pointer;' +
                    'background:var(--cds-button-primary,#0f62fe);color:#fff;">Sign in</button>' +
                    '<p id="shell-signin-error" role="alert" style="min-height:1.25rem;font-size:0.75rem;color:#ff8389;margin:0.75rem 0 0 0;"></p>' +
                    '</form>';
                document.body.appendChild(gate);
                document.getElementById('shell-signin-form').addEventListener('submit', function (e) {
                    e.preventDefault();
                    var err = document.getElementById('shell-signin-error');
                    err.textContent = '';
                    auth.auth.signInWithPassword({
                        email: document.getElementById('shell-signin-email').value,
                        password: document.getElementById('shell-signin-password').value
                    }).then(function (r) {
                        if (r.error || !r.data || !r.data.session) {
                            err.textContent = (r.error && r.error.message) || 'Sign-in failed';
                            return;
                        }
                        enter(r.data.session);
                    });
                });
            }

            // A DATA FAILURE MUST NEVER BE SILENT (s31 resume, 2026-08-20: a signed-in
            // user's morning screen showed "no accounts" over a 403). Components paint
            // their own error state and emit blueprint:error; the shell's added duty is
            // the AUTH case -- when the session is gone, the honest answer is the
            // sign-in gate, not an error nobody can act on. A live session with a
            // failing read stays visible as the component's error: that is a grants
            // problem, and re-signing-in would just hide it.
            document.addEventListener('blueprint:error', function (e) {
                var d = e.detail || {};
                if (d.code !== 'DATA_LOAD_FAILED') { return; }
                auth.auth.getSession().then(function (r) {
                    var live = r.data && r.data.session;
                    if (!live && !document.getElementById('shell-signin-gate')) { showGate(); }
                });
            });

            auth.auth.getSession().then(function (r) {
                var session = r.data && r.data.session;
                if (session) { enter(session); } else { showGate(); }
            });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', bootWhenAuthorized);
        } else {
            bootWhenAuthorized();
        }
    </script>

    <!--
      Carbon last, and as a module. It defines custom elements; the markup above is inert until it
      resolves and then upgrades in place. Nothing else waits on it, which is why a slow CDN
      degrades to an unstyled but working page rather than a blank one.
    -->
    <script type="module">
      import 'https://esm.sh/@carbon/web-components@2.56.0/es/components/ui-shell/index.js';
      customElements.whenDefined('cds-header').then(() => {
        document.body.setAttribute('data-carbon-ready', 'true');
        console.log('[CarbonShell] Carbon UI Shell upgraded');
      }).catch(err => {
        // Named rather than swallowed: an un-upgraded shell still renders and still fetches, and
        // whoever is looking at a plain page deserves to know why.
        console.error('[CarbonShell] Carbon failed to load -- the shell will render unstyled:', err);
      });
    </script>
</body>
</html>
